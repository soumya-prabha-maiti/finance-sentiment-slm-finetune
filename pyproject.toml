[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-sentiment-slm-finetune"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Soumya Prabha Maiti", email = "soumyaprabhamaiti2001@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[tool.hatch.version]
path = "src/finance_sentiment_slm_finetune/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/finance_sentiment_slm_finetune tests}"

[tool.coverage.run]
source_pkgs = ["finance_sentiment_slm_finetune", "tests"]
branch = true
parallel = true
omit = [
  "src/finance_sentiment_slm_finetune/__about__.py",
]

[tool.coverage.paths]
finance_sentiment_slm_finetune = ["src/finance_sentiment_slm_finetune", "*/finance-sentiment-slm-finetune/src/finance_sentiment_slm_finetune"]
tests = ["tests", "*/finance-sentiment-slm-finetune/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

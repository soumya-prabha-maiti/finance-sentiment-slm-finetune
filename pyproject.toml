[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-sentiment-slm-finetune"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Soumya Prabha Maiti", email = "soumyaprabhamaiti2001@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "torch==2.12.1",
  "transformers>=4.46,<5",
  "huggingface-hub==0.36.2",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.0,<2",
  "peft>=0.13,<1",
  "datasets>=3.0,<5",
]
app = [
  "gradio[mcp,oauth]==6.17.3",
]

[project.scripts]
finsent-train = "finance_sentiment_slm_finetune.train:main"
finsent-app = "finance_sentiment_slm_finetune.app:main"

[tool.hatch.version]
path = "src/finance_sentiment_slm_finetune/__about__.py"

[tool.hatch.envs.default]
features = ["train", "app"]

[tool.hatch.envs.default.scripts]
train = "finsent-train {args}"
app = "finsent-app {args}"

[tool.hatch.envs.hatch-test]
features = ["train", "app"]

[tool.hatch.envs.types]
features = ["train", "app"]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/finance_sentiment_slm_finetune tests}"

[tool.coverage.run]
source_pkgs = ["finance_sentiment_slm_finetune", "tests"]
branch = true
parallel = true
omit = [
  "src/finance_sentiment_slm_finetune/__about__.py",
]

[tool.coverage.paths]
finance_sentiment_slm_finetune = ["src/finance_sentiment_slm_finetune", "*/finance-sentiment-slm-finetune/src/finance_sentiment_slm_finetune"]
tests = ["tests", "*/finance-sentiment-slm-finetune/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
